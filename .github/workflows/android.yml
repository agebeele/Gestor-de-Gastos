name: Build Android APK (Pesos Mexicanos)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK para Teléfono
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Keystore de Firma Debug
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restaurando debug.keystore desde base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generando nuevo debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar archivo APK para instalación
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/GestorDeGastos-MXN.apk
          echo "APK generado exitosamente en output_apk/GestorDeGastos-MXN.apk"

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: GestorDeGastos-PesosMexicanos-APK
          path: output_apk/GestorDeGastos-MXN.apk
          retention-days: 30

      - name: Resumen de Instalación
        run: |
          echo "### 📱 ¡Tu APK de Gestor de Gastos en Pesos Mexicanos (MXN) está listo!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "El archivo **GestorDeGastos-MXN.apk** se ha generado correctamente." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📲 Pasos para instalar en tu teléfono:" >> $GITHUB_STEP_SUMMARY
          echo "1. Ve a la pestaña **Actions** de tu repositorio en GitHub." >> $GITHUB_STEP_SUMMARY
          echo "2. Abre la última ejecución de este workflow (**Build Android APK**)." >> $GITHUB_STEP_SUMMARY
          echo "3. En la parte inferior, en la sección **Artifacts**, haz clic en **GestorDeGastos-PesosMexicanos-APK** para descargarlo." >> $GITHUB_STEP_SUMMARY
          echo "4. Pasa el archivo a tu teléfono o descárgalo directamente desde el navegador de tu celular." >> $GITHUB_STEP_SUMMARY
          echo "5. Al abrir el archivo `.apk`, si Android te pide permisos, activa la opción **Permitir instalar aplicaciones de esta fuente**." >> $GITHUB_STEP_SUMMARY
          echo "6. ¡Toca **Instalar** y disfruta tu app de finanzas 100% en Pesos Mexicanos!" >> $GITHUB_STEP_SUMMARY
