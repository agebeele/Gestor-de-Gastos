name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK para Teléfono
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Entorno, Keystore y Licencias
        run: |
          touch .env
          
          # Restaurar o generar debug.keystore garantizado
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decodificando debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
          fi
          
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generando debug.keystore nuevo con keytool..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Asegurar copia en app/ por compatibilidad
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          ls -la debug.keystore
          
          # Licencias de Android SDK
          sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          
          # Wrapper
          if [ ! -f "gradlew" ]; then
            echo "gradlew no encontrado, generando wrapper..."
            gradle wrapper || true
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Compilar APK Debug
        run: |
          # Verificar presencia de debug.keystore antes de compilar
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Preparar archivo APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/GestorDeGastos-MXN.apk 2>/dev/null || true

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Resumen en GitHub
        run: |
          echo "### 📱 ¡APK compilado con éxito!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Se ha generado tu APK listo para instalar en tu teléfono celular:" >> $GITHUB_STEP_SUMMARY
          echo "- **GestorDeGastos-MXN.apk** (app-debug.apk)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Descárgalo en la sección **Artifacts** (archivo **app-debug**)." >> $GITHUB_STEP_SUMMARY
